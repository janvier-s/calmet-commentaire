<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calmet Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c27a12'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='bold' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script>
  // theme before first paint: saved choice, else the Mac's setting (light → paper)
  (() => {
    let t = null;
    try { t = localStorage.getItem("rw-theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "paper";
    document.documentElement.dataset.theme = t;
  })();
</script>
<script type="module" src="/static/main.js"></script>
</head>
<body>
<div id="loadbar" hidden><i></i></div>
<header id="top">
  <nav class="nav-crumbs" aria-label="Where">
    <select id="vol" title="Book (with how many issues of the list it has)"></select>
    <span class="nav-sep">›</span>
    <div class="group">
      <button id="issue-prev" data-icon="back" title="Previous issue (⌘[)">Issue</button>
      <span id="counter" class="muted"></span>
      <button id="issue-next" class="icon-after" data-icon="fwd" title="Next issue (⌘])">Issue</button>
    </div>
    <span class="nav-sep">›</span>
    <div class="group">
      <button id="page-prev" class="pagebtn" data-icon="prev" title="Previous page (←)"></button>
      <input id="page-num" size="4" title="Go to page">
      <button id="page-next" class="pagebtn" data-icon="next" title="Next page (→)"></button>
    </div>
  </nav>
  <nav class="nav-tabs"><a class="nav-tab on" href="/" aria-current="page">Review</a><a class="nav-tab" id="merge-tab" href="/merge" title="The Good_Calmet merge screen">Merge</a></nav>
  <span class="seg" id="mode-seg" title="Which text you edit: the old (normalized) page, or the page as /merge built it">
    <button data-mode="old">Old</button><button data-mode="merged">Merged</button></span>
  <select id="merged-pages" title="The book's pages /merge changed: open one on Merged"></select>
  <span class="seg" id="scan-seg" title="The scan shown beside the text"></span>
  <span class="group" id="good-step" hidden><button id="good-prev" data-icon="prev" title="Previous Good_Calmet page (,): the text stays"></button><button id="good-next" data-icon="next" title="Next Good_Calmet page (.): the text stays"></button></span>
  <button id="turn-btn" data-icon="turn" title="Page turn: the foot of this page over the head of the next (T)" hidden>Turn</button>
  <span class="jumpbox" data-icon="search"><input id="jump" placeholder="ch:v or word" size="10" title="Chapter and verse (17:2), chapter (17) or page (p194), Return to go; anything else searches the book's text, accents and case aside (Return again: next hit)"><div id="search-panel" hidden></div></span>
  <span id="search-step" class="group" hidden><button id="search-prev" data-icon="prev" title="Previous hit"></button><button id="search-pos" class="link small" title="Show the hits"></button><button id="search-next" data-icon="next" title="Next hit"></button></span>
  <span id="jump-msg" class="muted"></span>
  <span class="grow"></span>
  <span id="rechecking" class="muted small"></span>
  <span id="dirty" class="muted"></span>
  <button id="italic" class="icon" data-icon="italic" title="Italics on the selection (⌘I)"></button>
  <button id="undo-all" data-icon="undo" title="Put the page back as it was when you opened it">Undo all</button>
  <button id="save" data-icon="save" title="Save (⌘S)">Save</button>
  <div id="markrow">
  <div id="filters">
    <select id="f-kind" title="Type of issue"></select>
    <select id="f-status" title="Status"></select>
    <select id="f-cat" title="Category"></select>
  </div>
  <div id="marks">
    <div class="group">
      <div class="menu">
        <button id="menu-btn" class="icon" data-icon="more" title="More"></button>
        <div id="menu" hidden>
          <button id="batch-btn" data-icon="table" title="Batch: every issue of the chosen type in a table">Batch</button>
          <label>Theme <select id="theme"><option value="paper">Paper</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
          <label><input type="checkbox" id="show-marks" checked> Show _ marks</label>
          <label><input type="checkbox" id="underline-it" checked> Underline italics in the commentary</label>
          <label><input type="checkbox" id="show-proposals" checked> Show proposed fixes</label>
          <label><input type="checkbox" id="renumber" checked> Renumber commentary_id when moving</label>
          <label><input type="checkbox" id="save-on-leave"> Save on page change</label>
          <button data-tool="flag">Flag for review</button>
          <button data-tool="json">Open JSON</button>
          <button data-tool="png">Reveal PNG in Finder</button>
          <button id="good-open" hidden>Open Good_Calmet page</button>
        </div>
      </div>
      <button id="mark-skip" data-icon="skip" title="Skip">Skip</button>
      <button id="mark-hold" data-icon="pause" title="On hold: neither resolved nor a false positive; it waits for something done elsewhere (a to-do added while it is open puts it on hold, and frees it once done)">On hold</button>
      <button id="mark-reopen" data-icon="reopen" title="Reopen the issue you last marked resolved, false positive or skipped, and go back to it">Reopen</button>
    </div>
    <div class="group">
      <button id="mark-fp" class="warn" data-icon="flag" title="False positive (⌘P)">False positive</button>
      <button id="mark-resolved-recheck" class="ok recheck" data-icon="check" title="Resolved after the page's re-check has finished, so the issues your edits fixed are already closed in the list (Alt+⏎)">Resolved + re-check</button>
      <button id="mark-resolved" class="ok" data-icon="check" title="Resolved, go to the next issue at once; the re-check runs in the background (⌘⏎ / Ctrl+⏎)">Resolved</button>
    </div>
  </div>
  </div>
</header>
<section id="issuebar">
  <div id="current"></div>
  <div id="type-pages"></div>
  <div id="pageinfo">
    <div id="pills"></div>
    <div id="around"></div>
  </div>
</section>
<section id="page-issues" hidden></section>
<main id="cols">
  <section id="scan-pane">
    <div id="scan-tools">
      <span class="menu"><button id="scan-menu-btn" class="icon" data-icon="more" title="Zoom, dimming, OCR and the other scan settings"></button>
        <div id="scan-menu" hidden>
          <button id="zoom-out" title="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" title="Zoom in">+</button>
          <button id="zoom-fit" title="Fit the page's width to the pane">Fit ↔︎</button><button id="zoom-fit-v" title="Fit the whole page's height to the pane">Fit ↕︎</button><button id="zoom-1">1:1</button>
          <label class="muted" title="Darken the scan">Dim <input type="range" id="dim" min="0" max="100" value="10"></label>
          <label class="muted dark-only" title="Show the scan light-on-dark in the dark theme"><input type="checkbox" id="invert" checked> Invert</label>
        </div></span>
      <span class="grow"></span>
    </div>
    <div id="scan-view"><img id="scan-img" alt="" draggable="false"><div id="scan-dim"></div><p id="no-scan" hidden>No scan for this page</p></div>
  </section>
  <div id="divider" title="Drag to resize"></div>
  <section id="text-pane">
    <div id="sections">
      <span id="edit-label">EDITING OLD</span>
      <span class="msel"><button id="sec-btn" title="Which parts of the page to show">All ▾</button>
        <div id="sec-pop" hidden>
          <label><input type="checkbox" value="heading" checked> Heading</label>
          <label><input type="checkbox" value="verses" checked> Verses</label>
          <label><input type="checkbox" value="commentary" checked> Commentary</label>
          <label><input type="checkbox" value="footnotes" checked> Footnotes</label>
        </div></span>
      <span class="grow"></span>
      <select id="shelf" title="Insert at the cursor (or copy if no field is active)"></select>
    </div>
    <div id="page-text"></div>
  </section>
</main>
<section id="turn" hidden></section>
<section id="batch" hidden></section>
<footer id="reviewed" hidden></footer>
<dialog id="dialog"><form method="dialog"><p id="dialog-msg"></p><div id="dialog-body"></div><menu id="dialog-buttons"></menu></form></dialog>
</body>
</html>
